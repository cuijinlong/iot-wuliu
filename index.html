<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>能耗概览</title>
<link rel="stylesheet" href="common.css">
<style>
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .kpi-card { background: white; padding: 16px; border-radius: 16px; box-shadow: var(--elevation-1); }
  .kpi-card .val { font-size: 22px; font-weight: 700; margin: 8px 0; }
  .progress-item { margin-bottom: 16px; }
  .progress-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .progress-bar-bg { height: 8px; background: var(--surface-variant); border-radius: 4px; overflow: hidden; }
</style>
</head>
<body>
<div class="app-container">
  <header class="app-bar">
    <div class="app-bar-title">能耗概览</div>
    <div class="app-bar-action" onclick="showToast('切换场站')">单相场站 ⌄</div>
  </header>

  <div class="page-viewport">
    <div class="page active">
      <!-- 核心指标 -->
      <div class="kpi-grid">
        <div class="kpi-card" style="background: linear-gradient(135deg, #107C41, #1A9B55); color: white;">
          <div style="font-size:13px; opacity:0.9;">今日用电量</div>
          <div class="val">21.7 <span style="font-size:12px; font-weight:400;">kW·h</span></div>
          <div style="font-size:11px; opacity:0.8;">环比昨日 ↓ 3.2%</div>
        </div>
        <div class="kpi-card">
          <div style="font-size:13px; color:var(--on-surface-variant);">本月累计</div>
          <div class="val">2,974 <span style="font-size:12px; font-weight:400; color:var(--on-surface-variant);">kW·h</span></div>
          <div style="font-size:11px; color:var(--green);">节能收益 ¥1,286</div>
        </div>
      </div>

      <!-- 趋势图 -->
      <div class="m3-card">
        <div class="section-title">近7天用能趋势 <button class="m3-text-button" onclick="showToast('查看详细报表')" style="color:var(--primary); border:none; background:none; font-size:13px;">详情 ›</button></div>
        <div style="height: 140px; display:flex; align-items:flex-end; justify-content:space-between; border-bottom: 1px solid var(--surface-variant); padding-bottom:8px;">
          <div style="width:12%; height:40%; background:#BFDBFE; border-radius:4px 4px 0 0;"></div>
          <div style="width:12%; height:60%; background:#BFDBFE; border-radius:4px 4px 0 0;"></div>
          <div style="width:12%; height:45%; background:#BFDBFE; border-radius:4px 4px 0 0;"></div>
          <div style="width:12%; height:80%; background:#BFDBFE; border-radius:4px 4px 0 0;"></div>
          <div style="width:12%; height:50%; background:#BFDBFE; border-radius:4px 4px 0 0;"></div>
          <div style="width:12%; height:70%; background:var(--primary); border-radius:4px 4px 0 0;"></div>
          <div style="width:12%; height:30%; background:#BFDBFE; border-radius:4px 4px 0 0;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--outline); margin-top:8px;">
          <span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>今日</span>
        </div>
      </div>

      <!-- 设备排行 (极简版) -->
      <div class="m3-card">
        <div class="section-title">高耗能设备 Top 2</div>
        <div class="progress-item">
          <div class="progress-header"><span>单相园-A栋照明</span> <span>361.03 kW·h</span></div>
          <div class="progress-bar-bg"><div style="height:100%; width:100%; background:#10B981;"></div></div>
        </div>
        <div class="progress-item">
          <div class="progress-header"><span>单相园-A栋插座</span> <span>325.19 kW·h</span></div>
          <div class="progress-bar-bg"><div style="height:100%; width:90%; background:#10B981;"></div></div>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><div class="nav-indicator"><span class="nav-icon">▦</span></div><div>概览</div></a>
    <a href="alerts.html" class="nav-item"><div class="nav-indicator"><span class="nav-icon">♧</span></div><div>告警</div></a>
    <a href="meter.html" class="nav-item"><div class="nav-indicator"><span class="nav-icon">✎</span></div><div>抄表</div></a>
    <a href="devices.html" class="nav-item"><div class="nav-indicator"><span class="nav-icon">⚙</span></div><div>运维</div></a>
  </nav>
</div>
<div class="toast" id="toast">操作成功</div>
<script src="common.js"></script>
</body>
</html>
